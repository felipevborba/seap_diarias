# Alternativa com TLS no próprio servidor (igual ao nginx-carteira.conf do CarteiraPenal):
# nginx escuta 4444 com certificado e repassa ao Kestrel em 127.0.0.1:5001.
# Nesse caso, no diarias.env: Kestrel__Endpoints__Http__Url=http://127.0.0.1:5001 e Proxy__IpsConfiaveis__0=127.0.0.1
# (a seção Kestrel do appsettings.Production.json tem precedência sobre ASPNETCORE_URLS).
server {
    listen 4444 ssl;
    server_name diarias.seap.pe.gov.br;

    ssl_certificate     /etc/letsencrypt/live/diarias.seap.pe.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diarias.seap.pe.gov.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
